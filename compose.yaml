services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ATLAS_ENV: development
      ATLAS_DB_PATH: /data/atlas_observatory.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - atlas_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  atlas_data:
